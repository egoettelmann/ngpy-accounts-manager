<clr-dropdown *ngIf="labels">
  <button type="button" class="btn btn-link" clrDropdownTrigger>
    {{ selectedLabels ? (selectedLabels.length + ('i18n.components.transactions.label-toggle.labels' | translate)) : ('i18n.components.transactions.label-toggle.all-labels' | translate) }}
    <cds-icon shape="angle" direction="down"></cds-icon>
  </button>
  <clr-dropdown-menu clrPosition="bottom-left" *clrIfOpen>
    <button type="button"
            clrDropdownItem
            (click)="toggleAllLabels()">
      <cds-icon *ngIf="!selectedLabels" shape="success-standard" class="is-success"></cds-icon>
      <cds-icon *ngIf="selectedLabels" shape="circle"></cds-icon>
      <span>&nbsp;{{ 'i18n.components.transactions.label-toggle.all-labels' | translate }}</span>
    </button>
    <button type="button"
            clrDropdownItem
            (click)="toggleLabel(null)">
      <cds-icon *ngIf="isSelected(null)" shape="success-standard" class="is-success"></cds-icon>
      <cds-icon *ngIf="!isSelected(null)" shape="circle"></cds-icon>
      <span>&nbsp;{{ 'i18n.components.transactions.label-toggle.no-label' | translate }}</span>
    </button>
    <button *ngFor="let label of labels"
            type="button"
            clrDropdownItem
            (click)="toggleLabel(label.id)">
      <cds-icon *ngIf="isSelected(label.id)" shape="success-standard" class="is-success"></cds-icon>
      <cds-icon *ngIf="!isSelected(label.id)" shape="circle"></cds-icon>
      <span>&nbsp;{{ label.name }}</span>
    </button>
  </clr-dropdown-menu>
</clr-dropdown>
